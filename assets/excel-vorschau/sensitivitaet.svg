<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Excel-Tab Sensitivitätsanalyse Vorschau">
  <rect width="320" height="180" fill="#f5f4f2"/>
  <rect x="0" y="0" width="320" height="22" fill="#1a3535"/>
  <text x="10" y="15" font-family="Inter, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="500">Sensitivitätsanalyse · Excel-Tab Szenarienvergleich</text>
  <!-- Tornado-Chart-Schema -->
  <g font-family="Inter, Arial, sans-serif" font-size="9">
    <text x="10" y="40" fill="#5a5956">Szenario</text>
    <text x="170" y="40" fill="#5a5956">Wirkung auf TCO 25 J</text>
  </g>
  <line x1="10" y1="44" x2="310" y2="44" stroke="#7ab8b5" stroke-width="0.5"/>
  <!-- Mittel-Achse -->
  <line x1="170" y1="50" x2="170" y2="158" stroke="#8a8680" stroke-width="0.5" stroke-dasharray="2,2"/>
  <!-- Balken (negativ + positiv vom Mittel) -->
  <g font-family="Inter, Arial, sans-serif" font-size="9" fill="#1a3535">
    <rect x="120" y="55" width="50" height="10" fill="#7ab8b5"/>
    <text x="10" y="63">CO₂-Pfad beschl.</text>
    <text x="115" y="63" text-anchor="end">−50k</text>

    <rect x="170" y="70" width="80" height="10" fill="#a87a4a" opacity="0.7"/>
    <text x="10" y="78">Gas-Subvention weg</text>
    <text x="255" y="78">+80k</text>

    <rect x="170" y="85" width="55" height="10" fill="#a87a4a" opacity="0.7"/>
    <text x="10" y="93">Stranded-Asset Hybrid</text>
    <text x="230" y="93">+55k</text>

    <rect x="135" y="100" width="35" height="10" fill="#7ab8b5"/>
    <text x="10" y="108">JAZ-Realität −0,3</text>
    <text x="130" y="108" text-anchor="end">−35k</text>

    <rect x="170" y="115" width="40" height="10" fill="#a87a4a" opacity="0.7"/>
    <text x="10" y="123">Grüngas 10 % ab 2029</text>
    <text x="215" y="123">+40k</text>

    <rect x="135" y="130" width="35" height="10" fill="#7ab8b5"/>
    <text x="10" y="138">EPBD-Abschlag −10 %</text>
    <text x="130" y="138" text-anchor="end">−35k</text>

    <rect x="155" y="145" width="15" height="10" fill="#7ab8b5"/>
    <text x="10" y="153">Mietspiegel halb</text>
    <text x="150" y="153" text-anchor="end">−15k</text>
  </g>
  <text x="10" y="172" font-family="Inter, Arial, sans-serif" font-size="8" fill="#8a8680" font-style="italic">Tornado-Diagramm: ±-Wirkung auf TCO Hybrid · 7+ frei wählbare Szenarien</text>
</svg>
