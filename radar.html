<style>
/* ============================================================
   Technik-Radar — eigenständige, gekapselte Feed-Ansicht (HELL).
   Teilt mit der Kern-Site nur die Farb-Tokens (per Wert),
   nicht die Komponenten-CSS. Alles hier ist lokal/scoped.
   ============================================================ */
:root{
  color-scheme: light;
  --petrol-dark:#1a3535;
  --petrol:#1a5c5a;
  --petrol-light:#7ab8b5;
  --signal:#CFF77F;
  --signal-ink:#33501a;   /* dunkler Text auf Signal-Flaeche */
  --tommy:#D81E34;
  --screen-1:#edf1ef;
  --screen-2:#e7ece9;
  --surface:#ffffff;
  --line:#dbe3e0;
  --ink:#1c2b29;          /* Haupttext */
  --ink-2:#586b67;        /* sekundaer */
  --ink-3:#8b9a96;        /* muted */
  --serif:'Playfair Display',Georgia,serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  background:radial-gradient(1200px 800px at 50% -10%,#eef4f2 0%,#e4ece9 45%,#dae5e1 100%);
  min-height:100vh;color:var(--ink);
  display:flex;justify-content:center;align-items:flex-start;
  padding:34px 16px 60px;
}
.device{
  width:400px;max-width:100%;
  background:#0b1a19;border-radius:46px;padding:12px;
  box-shadow:0 40px 90px rgba(20,45,42,.28),0 0 0 1px rgba(20,45,42,.06),inset 0 0 0 2px #05100f;
  position:relative;
}
.device::before{
  content:"";position:absolute;top:20px;left:50%;transform:translateX(-50%);
  width:128px;height:26px;background:#0b1a19;border-radius:0 0 16px 16px;z-index:6;
}
.screen{
  background:linear-gradient(180deg,var(--screen-1),var(--screen-2));
  border-radius:36px;overflow:hidden;height:812px;overflow-y:auto;position:relative;scrollbar-width:none;
}
.screen::-webkit-scrollbar{display:none}
/* App bar */
.appbar{
  position:sticky;top:0;z-index:5;backdrop-filter:blur(14px);
  background:rgba(255,255,255,.88);border-bottom:1px solid var(--line);
  padding:34px 15px 11px;display:flex;align-items:center;gap:11px;
}
.appbar .logo{
  width:38px;height:38px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 35%,#1f4f4a,#173733);border:1px solid rgba(207,247,127,.55);
}
.appbar .logo svg{width:22px;height:22px}
.appbar .t{flex:1;min-width:0}
.appbar .name{font-weight:800;font-size:15px;letter-spacing:.2px;color:var(--petrol-dark)}
.appbar .sub{font-size:11px;color:var(--ink-3);margin-top:1px}
.appbar .home{flex:0 0 auto;display:inline-flex;align-items:center;text-decoration:none;opacity:.9}
.appbar .home:hover{opacity:1}
.appbar .home svg{display:block}
/* Hero-Banner (wiederkehrendes Marken-Bild, Motiv 2) */
.hero{display:block;width:100%;height:auto;border-bottom:1px solid var(--line)}
/* Pinned follow */
.pin{
  margin:12px;padding:13px 14px;border-radius:16px;
  background:linear-gradient(120deg,rgba(207,247,127,.30),rgba(122,184,181,.12));
  border:1px solid rgba(168,212,90,.55);display:flex;align-items:center;gap:12px;
}
.pin .pintxt{flex:1}
.pin .pintxt b{font-size:13px;display:block;margin-bottom:2px;color:var(--petrol-dark)}
.pin .pintxt span{font-size:11.5px;color:var(--ink-2);line-height:1.35}
.pin .follow{
  flex:0 0 auto;background:var(--tommy);color:#fff;border:none;font-family:var(--sans);
  font-weight:800;font-size:12.5px;border-radius:999px;padding:9px 16px;cursor:pointer;white-space:nowrap;transition:.15s;
}
.pin .follow:hover{filter:brightness(1.06)}
/* Themen-Filter */
.filterbar{padding:2px 12px 0;margin-top:2px}
.filterbar .lead{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin:0 3px 7px}
.filterbar .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filterbar .chips::-webkit-scrollbar{display:none}
.chip{
  display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;background:#eef3f1;color:var(--petrol);
  border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-family:var(--sans);font-size:12px;
  font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;
}
.chip svg{width:14px;height:14px}
.chip:hover{background:#e4ece9}
.chip.on{background:var(--petrol);color:#fff;border-color:var(--petrol)}
.filter-empty{font-size:12px;color:var(--ink-3);text-align:center;padding:8px 0 2px}
/* Ausgabe-Trenner */
.issue-head{padding:10px 15px 0;margin-top:2px}
.issue-head .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.issue-head .ti{font-family:var(--serif);font-size:16px;color:var(--petrol-dark);margin:2px 0 0;line-height:1.25}
.feed{padding:2px 12px 20px}
.post{background:var(--surface);border:1px solid #d3ddd9;border-radius:18px;padding:15px 15px 8px;margin:14px 0;box-shadow:0 1px 3px rgba(20,45,42,.09)}
.post.signal{
  background:linear-gradient(180deg,rgba(207,247,127,.22),#ffffff 58%);
  border-color:rgba(168,212,90,.6);box-shadow:0 8px 22px rgba(120,160,60,.10);
}
.phead{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.ava{width:40px;height:40px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;color:var(--petrol);
  background:#eef3f1;border:1px solid var(--line)}
.ava svg{width:22px;height:22px}
.ava.sig{background:radial-gradient(circle at 50% 35%,#dff89a,#bfe673);border-color:#bfe673;color:var(--signal-ink)}
.phead .who{flex:1;min-width:0}
.phead .who .n{font-weight:700;font-size:13.5px;color:var(--petrol-dark)}
.phead .who .h{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.rubrik{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:4px 9px;border-radius:999px;flex:0 0 auto;
  background:#eef3f1;color:var(--petrol);border:1px solid var(--line)}
.rubrik svg{width:13px;height:13px}
.rubrik.sig{background:var(--signal);color:var(--signal-ink);border-color:#bfe673}
.ptitle{font-family:var(--serif);font-size:18px;line-height:1.24;margin:2px 0 8px;color:var(--petrol-dark);font-weight:700}
.pbody{font-size:13.5px;line-height:1.52;color:var(--ink);margin:0 0 10px}
.pbody b{color:var(--petrol-dark)}
.mini{font-size:12px;line-height:1.45;color:var(--ink-2);background:#eef3f1;border-radius:10px;padding:8px 10px;margin:0 0 10px}
.mini b{color:var(--petrol)}
.mini.pruef{background:#fdf3d8;border-left:3px solid #d9a94e}
.mini.pruef b{color:#9a771c}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;color:var(--signal-ink);
  background:var(--signal);border:none;border-radius:999px;padding:4px 9px;margin:0 0 10px}
.badge .dot{width:6px;height:6px;border-radius:50%;background:var(--signal-ink)}
/* Erfurt-Bruecke — Tommy-Rot-Signatur */
.bridge{border-left:3px solid var(--tommy);background:linear-gradient(90deg,rgba(216,30,52,.09),rgba(216,30,52,.02));
  border-radius:0 12px 12px 0;padding:10px 12px;margin:0 0 11px}
.bridge .lab{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.07em;
  text-transform:uppercase;color:var(--tommy);margin-bottom:5px}
.bridge .lab svg{width:13px;height:13px}
.bridge p{margin:0;font-size:13px;line-height:1.48;color:#3a2a2c}
.bridge .ref{margin-top:7px;padding-top:7px;border-top:1px dashed rgba(216,30,52,.28);font-size:12.5px;color:#5b4448}
.bridge .ref b{color:var(--tommy);font-weight:700}
.src{font-size:11px;color:var(--ink-3);margin:0 0 4px}
.src a{color:var(--petrol);text-decoration:none;border-bottom:1px solid rgba(26,92,90,.35)}
.src a:hover{border-bottom-color:var(--petrol)}
/* Reaction-Bar — dezent, ohne erfundene Zahlen, keine echte Datenerfassung */
.bar{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
.rx{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:none;border:none;color:var(--ink-3);
  font-family:var(--sans);font-size:12px;font-weight:600;padding:9px 4px;border-radius:10px;cursor:pointer;transition:.15s}
.rx:hover{background:#eef3f1;color:var(--petrol)}
.rx svg{width:16px;height:16px}
.rx.on{color:var(--petrol)}
.note{background:#f3f7f5;border:1px dashed var(--line);border-radius:16px;
  padding:13px 15px;margin:12px 0;font-size:12.5px;color:var(--ink-2);line-height:1.45}
.note b{color:var(--petrol)}
/* CTA */
.cta{margin:12px 0;padding:18px 16px;border-radius:20px;text-align:center;
  background:linear-gradient(160deg,#f3f9ef,#e9f3ea);border:1px solid rgba(168,212,90,.6)}
.cta .qr{width:96px;height:96px;border-radius:14px;background:#fff;margin:0 auto 12px;display:grid;place-items:center;border:1px solid var(--line)}
.cta .qr svg{width:78px;height:78px}
.cta h3{font-family:var(--serif);font-size:18px;margin:0 0 6px;color:var(--petrol-dark)}
.cta p{font-size:12.5px;color:var(--ink-2);line-height:1.45;margin:0 auto 13px;max-width:30ch}
.cta .go{display:inline-flex;align-items:center;gap:8px;background:var(--signal);color:var(--signal-ink);
  font-weight:800;font-size:13.5px;border-radius:999px;padding:11px 20px;text-decoration:none;border:none;cursor:pointer}
.cta .go:hover{filter:brightness(.96)}
.cta .go svg{width:18px;height:18px}
.cta .fine{font-size:10.5px;color:var(--ink-3);margin-top:10px}
/* Archiv */
.archiv{margin:16px 12px 0}
.archiv .h{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin:0 3px 8px}
.arow{display:flex;justify-content:space-between;gap:10px;padding:11px 13px;border:1px solid var(--line);
  border-radius:14px;margin-bottom:8px;background:#f7faf9;font-size:12.5px}
.arow .k{color:var(--ink-3);font-weight:700;white-space:nowrap}
.arow .t{color:var(--ink)}
.foot{text-align:center;font-size:10.5px;color:var(--ink-3);padding:14px 20px 26px;line-height:1.6}
.foot a{color:var(--petrol);text-decoration:none}
@media(max-width:520px){
  body{padding:0;background:linear-gradient(180deg,var(--screen-1),var(--screen-2));align-items:stretch}
  .device{width:100%;border-radius:0;padding:0;box-shadow:none;background:none}
  .device::before{display:none}
  .screen{border-radius:0;height:100vh}
  .appbar{padding-top:calc(12px + env(safe-area-inset-top))}
}
</style>
</head>

    {
      typ:"note",
      text:'<b>Solarthermie & weitere Technologien:</b> diese Woche kein aufnahmewürdiger Stand. Wir melden uns, wenn sich etwas bewegt — kein Signal wird konstruiert.'
    }
  ]
}
];

/* ===== Render ===== */
function rubrikChip(p){
  const cls = p.icon==="signal" ? "rubrik sig" : "rubrik";
  return '<span class="'+cls+'">'+(RUBRIK_ICON[p.icon]||"")+p.rubrik+'</span>';
}
function bridgeBlock(b){
  if(!b) return "";
  let html = '<div class="bridge"><div class="lab">'+IC.pin+'Für Erfurt</div><p>'+b.fuerErfurt+'</p>';
  if(b.referenz) html += '<div class="ref"><b>Am Referenzgebäude:</b> '+b.referenz+'</div>';
  return html+'</div>';
}
function quellen(q){
  if(!q||!q.length) return "";
  return '<p class="src">Quellen: '+q.map(x=>'<a href="'+x.u+'" target="_blank" rel="noopener">'+x.t+'</a>').join(" · ")+'</p>';
}
function reactionBar(){
  return '<div class="bar">'+
    '<button class="rx like">'+IC.bulb+'<span>Relevant</span></button>'+
    '<button class="rx save-b">'+IC.save+'<span>Merken</span></button>'+
    '<button class="rx share-b">'+IC.share+'<span>Teilen</span></button>'+
  '</div>';
}
function renderPost(p){
  if(p.typ==="note") return '<div class="note">'+p.text+'</div>';
  const isSig = p.typ==="signal";
  let html = '<article class="post'+(isSig?' signal':'')+'" data-rubrik="'+(p.icon||'')+'">';
  html += '<div class="phead">';
  html += '<div class="ava'+(isSig?' sig':'')+'">'+(isSig?IC.bulb:RUBRIK_ICON[p.icon]||IC.bulb)+'</div>';
  html += '<div class="who"><div class="n">Hausentscheider</div><div class="h">KW 27 · '+p.rubrik+'</div></div>';
  html += rubrikChip(p)+'</div>';
  if(p.badge) html += '<span class="badge"><span class="dot"></span>'+p.badge+'</span>';
  html += '<h2 class="ptitle">'+p.titel+'</h2>';
  html += '<p class="pbody">'+p.body+'</p>';
  if(p.einordnung) html += '<div class="mini"><b>Einordnung:</b> '+p.einordnung+'</div>';
  if(p.pruef) html += '<div class="mini pruef"><b>Prüfbedarf:</b> '+p.pruef+'</div>';
  html += bridgeBlock(p.bridge);
  html += quellen(p.quellen);
  html += reactionBar();
  return html+'</article>';
}
function ctaCard(){
  return '<div class="cta">'+
    '<div class="qr">'+qrPlaceholder()+'</div>'+
    '<h3>Den Radar aufs Handy</h3>'+
    '<p>Einmal pro Woche im WhatsApp-Kanal. Einseitig, ohne Anmeldung, jederzeit kündbar.</p>'+
    '<a class="go js-kanal-link" href="'+KANAL_URL+'" target="_blank" rel="noopener">'+IC.wa+'Kanal in WhatsApp öffnen</a>'+
    '<div class="fine">Ihre Nummer bleibt für uns und andere unsichtbar. QR-Code folgt mit der Kanal-Freischaltung.</div>'+
  '</div>';
}
function qrPlaceholder(){
  return '<svg viewBox="0 0 100 100" fill="#16302e" aria-label="QR-Platzhalter">'+
    '<rect x="8" y="8" width="26" height="26" fill="none" stroke="#16302e" stroke-width="5"/><rect x="16" y="16" width="10" height="10"/>'+
    '<rect x="66" y="8" width="26" height="26" fill="none" stroke="#16302e" stroke-width="5"/><rect x="74" y="16" width="10" height="10"/>'+
    '<rect x="8" y="66" width="26" height="26" fill="none" stroke="#16302e" stroke-width="5"/><rect x="16" y="74" width="10" height="10"/>'+
    '<rect x="42" y="10" width="5" height="5"/><rect x="52" y="10" width="5" height="5"/><rect x="42" y="20" width="5" height="5"/>'+
    '<rect x="42" y="42" width="5" height="5"/><rect x="52" y="42" width="5" height="5"/><rect x="62" y="42" width="5" height="5"/>'+
    '<rect x="42" y="52" width="5" height="5"/><rect x="72" y="52" width="5" height="5"/><rect x="82" y="52" width="5" height="5"/>'+
    '<rect x="42" y="62" width="5" height="5"/><rect x="52" y="62" width="5" height="5"/><rect x="62" y="72" width="5" height="5"/>'+
    '<rect x="72" y="72" width="5" height="5"/><rect x="82" y="82" width="5" height="5"/><rect x="52" y="82" width="5" height="5"/></svg>';
}

/* ===== Themen-Filter (clientseitig, keine Datenerfassung) ===== */
const activeFilters = new Set();
function vorhandeneRubriken(){
  const present = {};
  ausgaben.forEach(a=>a.posts.forEach(p=>{ if(p.icon) present[p.icon]=p.rubrik; }));
  return FILTER_ORDER.filter(k=>present[k]).map(k=>({key:k,label:present[k]}));
}
function renderFilter(){
  const fb=document.getElementById("filterbar");
  const rubs=vorhandeneRubriken();
  if(rubs.length<2){ fb.style.display="none"; return; }
  fb.innerHTML='<div class="lead">Themen wählen — nur diese anzeigen</div>'+
    '<div class="chips">'+rubs.map(r=>'<button class="chip" data-rubrik="'+r.key+'">'+(RUBRIK_ICON[r.key]||"")+'<span>'+r.label+'</span></button>').join("")+'</div>';
  fb.querySelectorAll(".chip").forEach(c=>{
    c.addEventListener("click",()=>{
      const k=c.getAttribute("data-rubrik");
      if(activeFilters.has(k)){ activeFilters.delete(k); c.classList.remove("on"); }
      else { activeFilters.add(k); c.classList.add("on"); }
      applyFilter();
    });
  });
}
function applyFilter(){
  const any=activeFilters.size>0;
  document.querySelectorAll("#feed .post").forEach(el=>{
    const r=el.getAttribute("data-rubrik");
    el.style.display=(!any||activeFilters.has(r))?"":"none";
  });
  document.querySelectorAll("#feed .note").forEach(el=>{ el.style.display=any?"none":""; });
}

(function(){
  document.getElementById("brand-logo").innerHTML = IC.bulbRay;
  const neu = ausgaben[0];
  let feed = '<div class="issue-head"><div class="k">Ausgabe KW '+neu.kw+'/'+neu.jahr+'</div><div class="ti">'+neu.titel+'</div></div>';
  feed += '<div class="feed">'+neu.posts.map(renderPost).join("")+ctaCard()+'</div>';
  document.getElementById("feed").innerHTML = feed;

  renderFilter();

  // Archiv (ab zweiter Ausgabe)
  if(ausgaben.length>1){
    let a = '<div class="archiv"><div class="h">Frühere Ausgaben</div>';
    a += ausgaben.slice(1).map(x=>'<div class="arow"><span class="k">KW '+x.kw+'/'+x.jahr+'</span><span class="t">'+x.titel+'</span></div>').join("");
    document.getElementById("archiv").innerHTML = a+'</div>';
  }

  document.getElementById("ds-hinweis").textContent = "Zum WhatsApp-Kanal siehe Datenschutzerklärung.";

  // Dezente, ehrliche Interaktion (keine Datenerfassung, keine Zähler)
  document.querySelectorAll(".rx.like, .rx.save-b").forEach(b=>{
    b.addEventListener("click",()=>b.classList.toggle("on"));
  });
  document.querySelectorAll(".rx.share-b").forEach(b=>{
    b.addEventListener("click",()=>{
      if(navigator.share){ navigator.share({title:"Technik-Radar — Hausentscheider", url:location.href}).catch(()=>{}); }
      else { b.classList.add("on"); }
    });
  });
  const fb=document.getElementById("follow-btn");
  fb.addEventListener("click",()=>{
    const on = fb.textContent.trim()==="Folgen";
    if(on){ window.open(KANAL_URL,"_blank"); fb.textContent="Kanal geöffnet"; }
  });
})();
</script>
