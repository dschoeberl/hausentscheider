<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#1b3c37"/>
      <stop offset="60%" stop-color="#16302e"/>
      <stop offset="100%" stop-color="#122a28"/>
    </radialGradient>
  </defs>
  <!-- Hintergrund (Petrol, wie im Vorbild) -->
  <rect width="1024" height="1024" fill="#16302e"/>
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Radar-Emblem, zentriert und im runden Zuschnitt sicher -->
  <g fill="none" stroke="#6fa7a0" stroke-width="16">
    <!-- feiner äußerer Ring (Radar-Tiefe) -->
    <circle cx="512" cy="512" r="300" stroke-opacity="0.45" stroke-width="10"/>
    <!-- äußerer Ring -->
    <circle cx="512" cy="512" r="224"/>
    <!-- innerer Ring -->
    <circle cx="512" cy="512" r="150"/>
  </g>

  <!-- roter Signalkern -->
  <circle cx="512" cy="512" r="86" fill="#d81e34"/>
</svg>
